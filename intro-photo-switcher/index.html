<head>
    <script src="./main.js" type="module"></script>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- <div>
        <img id="img" style="height:800px; width:auto;">
    </div> -->
    <div class="chat-container">
        <!-- Chat Header -->
        <div class="chat-header">
          <div class="avatar-text">C</div>
          <div class="header-info">
            <div class="header-title">Chat App</div>
            <div class="header-subtitle">Online - 2 participants</div>
          </div>
          <button class="options-btn">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path>
            </svg>
          </button>
        </div>
        
        <!-- Messages Container -->
        <div class="messages-container" id="messagesContainer">
          <!-- Messages will be populated by JavaScript -->
        </div>
        
        <!-- Input Area -->
        <div class="chat-input">
          <div class="input-actions">
            <button class="action-btn">
              <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
            </button>
            <button class="action-btn">
              <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path>
              </svg>
            </button>
          </div>
          <textarea id="messageInput" class="message-input" placeholder="Type a message..." rows="1"></textarea>
          <button id="sendButton" class="send-btn" disabled>
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
            </svg>
          </button>
        </div>
    </div>
</body>
